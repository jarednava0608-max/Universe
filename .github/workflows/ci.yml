# Pruebas y compilación en cada PR y en la rama de producción.
name: CI

on:
  pull_request:
  push:
    branches: [claude/zen-mendel-l8h9lw]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
